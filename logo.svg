<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="t">
  <title id="t">Reconomy logo</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#0d1a33"/>
      <stop offset="1" stop-color="#03060d"/>
    </radialGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fb0ff"/>
      <stop offset="1" stop-color="#3b6ff0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="c"><circle cx="32" cy="32" r="31"/></clipPath>
  </defs>

  <!-- circular badge -->
  <circle cx="32" cy="32" r="31" fill="url(#bg)"/>
  <circle cx="32" cy="32" r="30.2" fill="none" stroke="#3d7bff" stroke-opacity=".75" stroke-width="1.4"/>

  <g transform="translate(32 33) scale(1.12) translate(-32 -33)">
  <g clip-path="url(#c)" filter="url(#glow)">
    <!-- return arrow: long arc from lower-left, over the top, to lower-right -->
    <path d="M18.1 40 A16 16 0 1 1 42.3 44.3" fill="none" stroke="url(#arc)" stroke-width="4.2" stroke-linecap="round"/>
    <!-- arrowhead -->
    <path d="M12.5 21.5 L23.5 13.5 L24.2 25.2 Z" fill="#7fb0ff" stroke="#7fb0ff" stroke-width="1.2" stroke-linejoin="round"/>
    <!-- motion lines -->
    <g stroke="#7fb0ff" stroke-width="2.3" stroke-linecap="round">
      <line x1="46.5" y1="16" x2="49.5" y2="11.5"/>
      <line x1="49" y1="21" x2="54" y2="18.5"/>
      <line x1="50.5" y1="26" x2="55.5" y2="26"/>
    </g>
  </g>

  <!-- parcel box (isometric) -->
  <g stroke="#1b3a8f" stroke-width=".9" stroke-linejoin="round">
    <path d="M21.5 28 L32 22.8 L42.5 28 L32 33.2 Z" fill="#f2f6ff"/>
    <path d="M21.5 28 L32 33.2 L32 45.5 L21.5 40.3 Z" fill="#dfe8ff"/>
    <path d="M32 33.2 L42.5 28 L42.5 40.3 L32 45.5 Z" fill="#bccffc"/>
  </g>
  <!-- tape -->
  <path d="M25.6 25.9 L28.1 24.7 L38.6 29.9 L36.1 31.1 Z" fill="#3462d6"/>
  <path d="M25.6 30 L28.1 31.25 L28.1 35.6 L25.6 34.35 Z" fill="#3462d6"/>
  <!-- label -->
  <g stroke="#3462d6" stroke-width="1.1" stroke-linecap="round">
    <line x1="35.6" y1="38.6" x2="39" y2="36.9"/>
    <line x1="35.6" y1="40.8" x2="39" y2="39.1"/>
  </g>
  </g>
</svg>
